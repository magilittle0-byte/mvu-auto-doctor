name: Real environment QC policy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  qc-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify tracked real-environment QC evidence
        env:
          QC_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node qc/real-env-qc.mjs ci
